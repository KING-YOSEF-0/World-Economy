<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Economy Bubbles</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<div id="nav"></div>
<main>
  <section class="hero">
    <h1>🫧 World Economy Bubbles</h1>
    <p>Convert money between countries, check the weather and see the time anywhere.</p>
  </section>

  <section class="card big">
    <h2>💱 Currency Converter</h2>
    <div class="row">
      <input id="amount" type="number" value="1000" min="0">
      <select id="from"></select>
      <button id="swap" class="bubble-btn" title="Swap">⇄</button>
      <select id="to"></select>
    </div>
    <div id="result" class="result">Loading rates…</div>
    <div id="popular" class="chips"></div>
  </section>

  <h2 class="center">🌐 Explore by Continent</h2>
  <div id="continents" class="grid"></div>
</main>
<div id="footer"></div>
<script src="app.js"></script>
</body>
</html>
